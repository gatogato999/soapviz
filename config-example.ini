; soapviz configuration. Every key is optional; the values below are the
; built-in defaults. Command-line flags (-addr, -open) override [server].
;
; [ui] and [generator] are only the starting point for a developer who has
; not changed anything. Once someone picks a theme or toggles an option, their
; browser remembers it and this file no longer affects them. The server keeps
; no per-user state, so many developers can share one instance.

[server]
; Use 0.0.0.0:8484 to serve other machines. There is no authentication.
listen = 127.0.0.1:8484
open_browser = false
; Largest XML accepted per request, in MiB.
max_body_mb = 8

[ui]
; light | dim | dark
theme = dim

[generator]
include_envelope = false
namespaces = false
json = false
; none | snake | camel
json_case = snake
omit_empty = false
; One named root type with every nested element as an anonymous struct inside it.
inline = false
; Leave empty for automatic.
root =
package =

[samples]
; A folder of plain .xml files shared by everyone using this server. A tag goes
; in the file name: "GetStatement [Req].xml". One level of subfolders groups
; related samples: shared_dir/BankX/GetStatement [Req].xml. Empty disables team samples.
shared_dir =
; false: team samples are read-only (an admin manages the files).
; true: anyone who can reach this server can publish, move and delete team samples
; and create, rename and delete (empty) team folders.
; There is no authentication, so only enable it on a network you trust.
shared_write = false

[tags]
; Color for a sample tag (1 to 4 letters, any case). Colors: yellow, blue, green,
; red, purple, orange, teal, gray. Tags not listed get a stable color from a hash
; of their text. These four are the built-in defaults.
req = yellow
res = blue
err = red
ok = green
